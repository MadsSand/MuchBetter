<form
    method="post"
    action="{{ url_for('admin_reset_user_password', user_id=reset_user_id) }}"
    class="admin-reset-form"
    onsubmit="return confirm('Nulstil kodeord for {{ reset_username }}?');"
>
    <div class="field">
        <label for="new-password-{{ reset_user_id }}">Nyt kodeord</label>
        <input
            type="text"
            id="new-password-{{ reset_user_id }}"
            name="new_password"
            autocomplete="new-password"
            minlength="6"
            maxlength="128"
            placeholder="Mindst 6 tegn"
            class="admin-reset-input"
        >
    </div>
    <label class="admin-reset-generate">
        <input
            type="checkbox"
            name="generate_password"
            value="on"
            checked
            class="admin-reset-generate-check"
            data-target="new-password-{{ reset_user_id }}"
        >
        Generer midlertidigt kodeord (anbefales)
    </label>
    <button type="submit" class="admin-pending-btn">Nulstil kodeord</button>
</form>
